<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>県庁見学のじゅんび</title><meta name="description" content="県庁見学前に、公共施設と災害時の役割を確かめる教材"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%231c5a76'/%3E%3Cpath d='M12 28 32 16l20 12M18 30h28v20H18zM27 50V38h10v12' fill='none' stroke='white' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#183c51;background:#edf5f7}*{box-sizing:border-box}body{margin:0}.shell{max-width:850px;margin:auto;padding:20px 20px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}header strong{font-size:clamp(1.25rem,3vw,1.65rem)}.date{font-size:1rem;color:#345b6a;background:white;border-radius:30px;padding:9px 15px}.progress{display:flex;gap:7px;margin:0 0 24px}.progress i{height:9px;flex:1;border-radius:12px;background:#c4d8df}.progress i.on{background:#237392}main{background:white;border:1px solid #d4e3e8;border-radius:24px;padding:clamp(22px,5vw,42px);box-shadow:0 10px 34px #244b5a13;min-height:530px}.step{font-size:1rem;font-weight:700;color:#22708f}.question{font-size:clamp(1.5rem,4vw,2.05rem);line-height:1.7;margin:12px 0 23px}ruby{ruby-position:over}rt{font-size:.48em;font-weight:500}.choices{display:grid;gap:12px}.choice,.action,.small{font:inherit;cursor:pointer}.choice{width:100%;min-height:76px;text-align:left;padding:14px 20px;border:2px solid #afcbd6;border-radius:16px;background:#f8fcfd;color:#153a50;font-size:clamp(1.2rem,3vw,1.55rem);font-weight:700;line-height:1.65}.choice:hover,.choice:focus-visible{border-color:#217b9f;background:#eaf7fb}.choice.selected{border-color:#18748c;background:#dff3f0}.choice.wrong{border-color:#bc684d;background:#fff1eb}.feedback{min-height:63px;margin:16px 0 8px;font-size:1.25rem;font-weight:700;line-height:1.6}.feedback.ok{color:#14634f}.feedback.no{color:#9c4930}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}.action{border:0;border-radius:14px;background:#166b87;color:#fff;min-height:62px;padding:12px 27px;font-size:1.2rem;font-weight:700}.action:disabled{opacity:.43;cursor:default}.small{background:transparent;color:#365d6e;border:0;padding:12px;font-size:1rem}.note{font-size:1.05rem;line-height:1.7;color:#426273}.order{display:grid;gap:11px}.order button{width:100%;min-height:70px;background:#f7fbfc;border:2px solid #b4cfd8;border-radius:15px;color:#183c51;font-size:1.3rem;font-weight:700}.order button:disabled{opacity:.42}.timeline{display:grid;gap:8px;margin:12px 0 20px}.slot{padding:10px 15px;border-radius:10px;background:#edf5f7;font-size:1.15rem;min-height:49px}.slot.filled{background:#dff2ef;font-weight:700}.mission{border:3px solid #2c7892;border-radius:22px;padding:28px;text-align:center;background:#f1f9fa}.mission h2{font-size:1.5rem;margin:0 0 25px}.mission .answer{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;line-height:1.75;min-height:155px;display:grid;place-items:center}.mission .visit{font-size:1.2rem;border-top:1px solid #bed6dc;padding-top:20px;margin-top:16px}.screenshot{font-size:1.1rem;text-align:center;margin:21px 0;color:#365b6b}@media(max-width:600px){.shell{padding:12px 12px 35px}header{align-items:flex-start}.date{font-size:.85rem;padding:7px 10px}main{min-height:0;padding:23px 18px}.actions{flex-wrap:wrap}.action{width:100%}.small{order:2}.mission{padding:20px 12px}}@media(prefers-reduced-motion:no-preference){.choice,.action{transition:background .16s,border-color .16s}}
</style></head><body><div class="shell"><header><strong><ruby>県庁<rt>けんちょう</rt></ruby><ruby>見学<rt>けんがく</rt></ruby>のじゅんび</strong></header><div class="progress" id="progress" aria-label="進みぐあい"></div><main id="app" aria-live="polite"></main></div><script>
const R=(s,r)=>`<ruby>${s}<rt>${r}</rt></ruby>`;
const readings={
'市役所':'しやくしょ','県庁':'けんちょう','住民票':'じゅうみんひょう','学校':'がっこう','県内':'けんない','市町村':'しちょうそん','災害情報':'さいがいじょうほう','災害':'さいがい','情報':'じょうほう','支援物資':'しえんぶっし','物資':'ぶっし','手配':'てはい','昼食':'ちゅうしょく','連絡':'れんらく','調整':'ちょうせい','県全体':'けんぜんたい','全体':'ぜんたい','人々':'ひとびと','市':'し','何':'なに','集':'あつ','出':'だ','起':'お','作':'つく','決':'き','各地':'かくち','必要':'ひつよう','知':'し','見学':'けんがく','順番':'じゅんばん','仕事':'しごと','流':'なが','画面':'がめん','提出':'ていしゅつ','一度':'いちど','考':'かんが'};
const readingPattern=new RegExp(Object.keys(readings).sort((a,b)=>b.length-a.length).join('|'),'g');
const label=s=>s.split(/(<ruby>[\s\S]*?<\/ruby>)/g).map(part=>part.startsWith('<ruby>')?part:part.replace(readingPattern,word=>R(word,readings[word]))).join('');
const tasks=[
{section:'市役所・県庁・どちらも',prompt:`市の ${R('住民票','じゅうみんひょう')} を もらうところは？`,options:['市役所','県庁','どちらも'],answer:0,reason:`${R('住民票','じゅうみんひょう')} は 市役所で もらえます。`},
{section:'市役所・県庁・どちらも',prompt:`${R('県内','けんない')}の 市町村と ${R('連絡','れんらく')}・${R('調整','ちょうせい')}をするのは？`,options:['市役所','県庁','どちらも'],answer:1,reason:'県庁は 県内の 市町村と 連絡・調整をします。'},
{section:'市役所・県庁・どちらも',prompt:`${R('災害','さいがい')}に そなえて、人々を ${R('守','まも')}るのは？`,options:['市役所','県庁','どちらも'],answer:2,reason:'市役所も 県庁も 災害に そなえます。'},
{section:'市役所・県庁・どちらも',prompt:`県全体の ${R('災害情報','さいがいじょうほう')}を 集めるのは？`,options:['市役所','県庁','どちらも'],answer:1,reason:'県庁は 県全体の 情報を 集めます。'},
{section:'災害が起きたら',prompt:`いくつもの 市町村で ${R('大雨','おおあめ')}。県庁は どうする？`,options:[`県内の 市町村と ${R('連絡','れんらく')}する`,'住民票を 出す','何もしない'],answer:0,reason:'県庁は 市町村と 連絡・調整を します。'},
{section:'災害が起きたら',prompt:`${R('支援物資','しえんぶっし')}が ${R('必要','ひつよう')}です。県庁は どうする？`,options:['学校の テストを 作る',`物資を ${R('手配','てはい')}する`,'住民票を 出す'],answer:1,reason:'県庁は 必要な 物資の 手配を します。'},
{section:'災害が起きたら',prompt:`県内の ${R('被害状況','ひがいじょうきょう')}を 知りたい。県庁は どうする？`,options:['昼食を 決める','市の 住民票を 出す',`各地の ${R('情報','じょうほう')}を 集める`],answer:2,reason:'県庁は 県全体の 情報を 集めます。'}];
const places=[`学校を ${R('出発','しゅっぱつ')}`,`${R('県庁見学','けんちょうけんがく')}`,`${R('昼食','ちゅうしょく')}`,`学校へ ${R('戻','もど')}る`];
const missions=[`${R('災害','さいがい')}への ${R('備','そな')}えを 見る`,`${R('県庁','けんちょう')}で ${R('働','はたら')}く人を 見る`,`${R('市役所','しやくしょ')}との ちがいを ${R('探','さが')}す`,`${R('災害時','さいがいじ')}の仕事について ${R('聞','き')}く`];
let index=0,selected=-1,correct=false,order=[],mission=-1,orderMistake=false;const app=document.getElementById('app');
function progress(){let part=index<4?0:index<7?1:index===7?2:3;document.getElementById('progress').innerHTML=Array.from({length:4},(_,i)=>`<i class="${i<=part?'on':''}"></i>`).join('')}
function render(){progress();if(index<tasks.length){let q=tasks[index];app.innerHTML=`<div class="step">${index+1} / 7　${label(q.section)}</div><h1 class="question">${label(q.prompt)}</h1><div class="choices">${q.options.map((o,i)=>`<button class="choice ${selected===i?(correct?'selected':'wrong'):''}" data-choice="${i}" ${correct?'disabled':''}>${label(o)}</button>`).join('')}</div><div class="feedback ${selected<0?'':correct?'ok':'no'}" role="status">${selected<0?'':correct?'せいかい！ '+label(q.reason):'もう一度 考えよう。'}</div><div class="actions"><button class="small" id="back" ${index===0?'hidden':''}>まえに もどる</button><button class="action" id="next" ${correct?'':'disabled'}>${index===6?'見学の じゅんばんへ':'つぎへ'}</button></div>`;app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);correct=selected===q.answer;render()});app.querySelector('#next').onclick=()=>{index++;selected=-1;correct=false;render()};if(index)app.querySelector('#back').onclick=()=>{index--;selected=-1;correct=false;render()};return}
if(index===7){app.innerHTML=`<div class="step">8 / 9　${R('見学','けんがく')}の ${R('順番','じゅんばん')}</div><h1 class="question">見学の日は どんな ${R('順番','じゅんばん')}？<br><small class="note">つぎにすることを おしてね。</small></h1><div class="timeline">${places.map((_,i)=>`<div class="slot ${order[i]!==undefined?'filled':''}">${i+1}. ${order[i]===undefined?'？':places[order[i]]}</div>`).join('')}</div><div class="order">${[2,0,3,1].filter(i=>!order.includes(i)).map(i=>`<button data-place="${i}">${places[i]}</button>`).join('')}</div><div class="feedback ${orderMistake?'no':order.length===4?'ok':''}" role="status">${orderMistake?'もう一度 考えよう。':order.length===4?'せいかい！ 見学の流れが わかりました。':''}</div><div class="actions"><button class="small" id="undo" ${order.length?'':'disabled'}>ひとつ もどす</button><button class="action" id="next" ${order.length===4?'':'disabled'}>見学ミッションへ</button></div>`;app.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.place)===order.length){order.push(order.length);orderMistake=false}else orderMistake=true;render()});app.querySelector('#undo').onclick=()=>{order.pop();orderMistake=false;render()};app.querySelector('#next').onclick=()=>{index=8;render()};return}
if(index===8){app.innerHTML=`<div class="step">9 / 9　自分で きめよう</div><h1 class="question">${R('県庁','けんちょう')}で 何を 見たい？<br>何を ${R('聞','き')}きたい？</h1><div class="choices">${missions.map((m,i)=>`<button class="choice ${mission===i?'selected':''}" data-mission="${i}" aria-pressed="${mission===i}">${m}</button>`).join('')}</div><div class="actions"><button class="small" id="back">まえに もどる</button><button class="action" id="finish" ${mission<0?'disabled':''}>ミッションを きめる</button></div>`;app.querySelectorAll('[data-mission]').forEach(b=>b.onclick=()=>{mission=Number(b.dataset.mission);render()});app.querySelector('#back').onclick=()=>{index=7;render()};app.querySelector('#finish').onclick=()=>{index=9;render()};return}
app.innerHTML=`<div class="mission"><h2>わたしの ${R('県庁見学','けんちょうけんがく')}ミッション</h2><div class="answer">${missions[mission]}</div><div class="visit">${R('県庁','けんちょう')}で たしかめよう</div></div><p class="screenshot">この画面を スクリーンショットして、ロイロノートに ${R('提出','ていしゅつ')}しよう。</p><div class="actions"><button class="small" id="back">ミッションを えらびなおす</button></div>`;app.querySelector('#back').onclick=()=>{index=8;render()}}
render();
</script></body></html>
